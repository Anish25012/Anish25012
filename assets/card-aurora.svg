<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Aurora: A desktop music player with an Apple-style design, built on Spotify’s Web Playback SDK.">
<title>Aurora</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0b24"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
  <linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1a72"/><stop offset="1" stop-color="#2ee6c5"/></linearGradient>
  <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2ee6c5"/><stop offset=".55" stop-color="#8b6bff"/><stop offset="1" stop-color="#ff5aa8"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b9a5ff"/></linearGradient>
  <filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
  <clipPath id="c"><rect width="1200" height="260" rx="22"/></clipPath>
</defs>
<style>
  .sp{transform-box:fill-box;transform-origin:center;animation:sp 4s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .gw{animation:gw 7s ease-in-out infinite alternate}
  @keyframes gw{from{opacity:.3}to{opacity:.65}}
  .b{fill:url(#bar);transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.2s ease-in-out infinite alternate}
  @keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
  .pr{transform-box:fill-box;transform-origin:0 50%;animation:pr 16s linear infinite}
  @keyframes pr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .k{font:700 13px ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace;fill:#9bffe9;letter-spacing:2.5px}
  .h{font:800 42px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:-1px}
  .q{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9c3e6}
  .v{font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
  .l{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#b4aed2}
  .p{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  @media (prefers-reduced-motion:reduce){.p{opacity:1}}
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="260" fill="url(#bg)"/>
  <circle class="gw" cx="150" cy="130" r="150" fill="#2ee6c5" filter="url(#gl)"/>
  <circle class="gw" cx="1120" cy="40" r="120" fill="#8b6bff" filter="url(#gl)" style="animation-delay:-3s"/>
  <g transform="translate(40,44)">
    <g class="sp"><circle cx="150" cy="86" r="82" fill="#0a0a0c"/>
      <circle cx="150" cy="86" r="72" fill="none" stroke="#fff" stroke-opacity=".09"/><circle cx="150" cy="86" r="62" fill="none" stroke="#fff" stroke-opacity=".09"/><circle cx="150" cy="86" r="52" fill="none" stroke="#fff" stroke-opacity=".09"/><circle cx="150" cy="86" r="42" fill="none" stroke="#fff" stroke-opacity=".09"/>
      <circle cx="150" cy="86" r="28" fill="url(#art)"/><circle cx="150" cy="86" r="4" fill="#0a0a0c"/><rect x="146" y="10" width="8" height="30" rx="4" fill="#fff" fill-opacity=".1"/></g>
    <rect width="172" height="172" rx="14" fill="url(#art)"/>
    <g transform="translate(46,48)"><rect x="0" y="40" width="9" height="36" rx="4.5" fill="#fff"/><rect x="16" y="20" width="9" height="56" rx="4.5" fill="#fff"/><rect x="32" y="0" width="9" height="76" rx="4.5" fill="#fff"/><rect x="48" y="26" width="9" height="50" rx="4.5" fill="#fff"/><rect x="64" y="44" width="9" height="32" rx="4.5" fill="#fff"/></g>
  </g>
  <text class="k" x="286" y="58">NOW PLAYING</text>
  <text class="h" x="284" y="106">Aurora</text>
  <text class="q" x="286" y="138">A desktop music player with an Apple-style design, built on Spotify’s Web Playback SDK.</text>
  <g transform="translate(286,166)"><g class="p" style="animation-delay:0.5s"><rect width="208" height="62" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/><text x="16" y="29" class="v">197 tests</text><text x="16" y="49" class="l">Vitest + Testing Library</text></g></g><g transform="translate(508,166)"><g class="p" style="animation-delay:0.6799999999999999s"><rect width="208" height="62" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/><text x="16" y="29" class="v">13 desktop checks</text><text x="16" y="49" class="l">including crash recovery</text></g></g><g transform="translate(730,166)"><g class="p" style="animation-delay:0.86s"><rect width="208" height="62" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/><text x="16" y="29" class="v">OAuth 2.0 PKCE</text><text x="16" y="49" class="l">no backend, no secrets</text></g></g><g transform="translate(952,166)"><g class="p" style="animation-delay:1.04s"><rect width="208" height="62" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/><text x="16" y="29" class="v">3.5% to 0.1% CPU</text><text x="16" y="49" class="l">after a render fix</text></g></g>
  <g transform="translate(1110,58)"><rect class="b" x="0" y="-11" width="5" height="11" rx="2.5" style="animation-duration:1.49s;animation-delay:-1.83s"/><rect class="b" x="9" y="-14" width="5" height="14" rx="2.5" style="animation-duration:1.16s;animation-delay:-0.67s"/><rect class="b" x="18" y="-20" width="5" height="20" rx="2.5" style="animation-duration:1.30s;animation-delay:-0.86s"/><rect class="b" x="27" y="-24" width="5" height="24" rx="2.5" style="animation-duration:1.52s;animation-delay:-0.34s"/><rect class="b" x="36" y="-18" width="5" height="18" rx="2.5" style="animation-duration:1.03s;animation-delay:-1.91s"/><rect class="b" x="45" y="-11" width="5" height="11" rx="2.5" style="animation-duration:1.30s;animation-delay:-1.15s"/></g>
  <rect x="0" y="255" width="1200" height="5" fill="#fff" fill-opacity=".08"/>
  <rect class="pr" x="0" y="255" width="1200" height="5" fill="url(#prog)"/>
</g></svg>