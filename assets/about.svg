<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Terminal: Anish Joshi, First Class Computer Science graduate, building Python, TypeScript and Java tools that remove manual work.">
<title>About Anish</title>
<style>
  .m{font:500 19px ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace;white-space:pre}
  .r{opacity:0;animation:o .01s forwards}
  @keyframes o{to{opacity:1}}
  @keyframes cv0{to{transform:translateX(75px)}}
  @keyframes cv2{to{transform:translateX(155px)}}
  @keyframes cv4{to{transform:translateX(178px)}}
  @keyframes cv8{to{transform:translateX(132px)}}
  .cur{opacity:0;animation:bl 1s 5.86s steps(2,jump-none) infinite}
  @keyframes bl{from{opacity:1}to{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.r,.cur{opacity:1}.cv{display:none}}
</style>
<rect width="1200" height="400" rx="18" fill="#120e2e" stroke="#fff" stroke-opacity=".12"/>
<circle cx="32" cy="28" r="7" fill="#ff5f57"/><circle cx="56" cy="28" r="7" fill="#febc2e"/><circle cx="80" cy="28" r="7" fill="#28c840"/>
<text x="600" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace" font-size="14" fill="#8a84ac">anish@github: ~</text>
<g class="r" style="animation-delay:0.40s"><text x="32" y="76" class="m" fill="#8b6bff">$</text><text x="54" y="76" class="m" fill="#ffffff">whoami</text><rect class="cv" x="54" y="56" width="75" height="28" fill="#120e2e" style="animation:cv0 0.36s steps(6) 0.40s forwards"/></g>
<g class="r" style="animation-delay:0.91s"><text x="32" y="106" class="m" fill="#c9c3e6">Anish Joshi. First Class Computer Science graduate, University of Kent.</text></g>
<g class="r" style="animation-delay:1.27s"><text x="32" y="136" class="m" fill="#8b6bff">$</text><text x="54" y="136" class="m" fill="#ffffff">cat focus.txt</text><rect class="cv" x="54" y="116" width="155" height="28" fill="#120e2e" style="animation:cv2 0.78s steps(13) 1.27s forwards"/></g>
<g class="r" style="animation-delay:2.20s"><text x="32" y="166" class="m" fill="#c9c3e6">Building Python, TypeScript and Java tools that remove manual work.</text></g>
<g class="r" style="animation-delay:2.56s"><text x="32" y="196" class="m" fill="#8b6bff">$</text><text x="54" y="196" class="m" fill="#ffffff">cat shipped.log</text><rect class="cv" x="54" y="176" width="178" height="28" fill="#120e2e" style="animation:cv4 0.90s steps(15) 2.56s forwards"/></g>
<g class="r" style="animation-delay:3.61s"><text x="32" y="226" class="m" fill="#9bffe9">✓ Python data loader: replaced 20+ hours of manual keying a month</text></g>
<g class="r" style="animation-delay:3.97s"><text x="32" y="256" class="m" fill="#9bffe9">✓ In-house grammar checker: used by 15+ staff</text></g>
<g class="r" style="animation-delay:4.33s"><text x="32" y="286" class="m" fill="#9bffe9">✓ Aurora: a desktop music player with 197 automated tests</text></g>
<g class="r" style="animation-delay:4.69s"><text x="32" y="316" class="m" fill="#8b6bff">$</text><text x="54" y="316" class="m" fill="#ffffff">cat now.txt</text><rect class="cv" x="54" y="296" width="132" height="28" fill="#120e2e" style="animation:cv8 0.66s steps(11) 4.69s forwards"/></g>
<g class="r" style="animation-delay:5.50s"><text x="32" y="346" class="m" fill="#ff9fcf">Polishing Aurora and picking up something new.</text></g>
<text x="32" y="376" class="m" fill="#8b6bff">$</text><rect class="cur" x="54" y="360" width="11" height="20" fill="#9bffe9"/>
</svg>