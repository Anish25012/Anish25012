name: Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#8b6bff&color_dots=#ebedf0,#c7f5ea,#7eebd5,#2ee6c5,#12a88d
            dist/snake-dark.svg?palette=github-dark&color_snake=#2ee6c5&color_dots=#161b22,#2a1f5c,#4a35a0,#8b6bff,#c9b8ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
